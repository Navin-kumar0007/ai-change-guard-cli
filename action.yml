name: AI Change Guard
description: Find retired and retiring AI models in your code, and test a model switch on your own prompts.
author: Navin-kumar0007
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Folder to scan, relative to the repository root.
    default: "."
  fail-on:
    description: "Fail the step when a model or API is: retired, retiring (within 90 days), or none."
    default: retired
  prompts:
    description: Golden set of real prompts (JSONL). When set with old-model and new-model, a replay test runs.
    default: ""
  old-model:
    description: Model you use today, as provider:model (e.g. openai:gpt-4o).
    default: ""
  new-model:
    description: Model to switch to, as provider:model (e.g. openai:gpt-6-luna).
    default: ""
  runs:
    description: Runs per prompt on each model (default 3 for a replay; a watch uses the baseline's number).
    default: ""
  concurrency:
    description: Calls in flight at once. Use 1 on free-tier keys.
    default: "2"
  max-calls:
    description: Refuse to start a replay above this many calls.
    default: "300"
  replay-fail-on:
    description: "Fail the step when a replayed prompt is: broken, changed, or none."
    default: broken
  baseline:
    description: "Watch mode: a baseline file made with `ai-change-guard baseline`. The same model is asked again and compared; the step fails when answers changed (3 of 5 runs) or the provider served another model."
    default: ""
  slack-webhook:
    description: "Watch mode: a Slack incoming-webhook URL (pass it from a secret) to post an alert when something changed."
    default: ""
  repair:
    description: "When the new model breaks a prompt's JSON format, try fixes on the new model and show the one that works (true or false). Extra calls count against max-calls."
    default: "false"
  open-pr:
    description: "After a replay that passes, open a pull request that switches old-model to new-model, with the replay report as proof (true or false). Runs on the default branch only; needs contents: write and pull-requests: write."
    default: "false"
  github-token:
    description: Token used to open the pull request. A GitHub App or personal token also starts your CI on it.
    default: ${{ github.token }}
runs:
  using: node24
  main: action/bundle/index.js
